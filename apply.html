<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подача заявки — Пятая стадия</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: left;
        }
        h1 { color: #ff4757; text-align: center; }
        .welcome-letter {
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ddd;
            line-height: 1.5;
            border-left: 4px solid #ff4757;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #bbb;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 80px; }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #ff6b81; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
        }
        .back-link:hover { color: #fff; }
        #message { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Подача заявки</h1>

        <!-- Письмо от разработчика -->
        <div class="welcome-letter" id="welcomeText">
            Приветствую вас на этом прекрасном (нет) проекте! Я очень признателен в том, что вы решили присоединиться в качестве одной из предложенных ролей. Для меня как для инди-разработчика это очень большая честь.
        </div>

        <form id="appForm">
            <!-- Динамические поля в зависимости от роли -->
            <div id="formFields"></div>

            <button type="submit">Отправить заявку</button>
        </form>

        <div id="message"></div>
        <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>

    <script>
        const SUPABASE_URL = "https://lochgdhgcpqpmbcgmdvy.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_G0sF7IL1XrCqf4Wad0bjCQ_1hCOCWPw"; 

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Определяем роль из ссылки (если ?role=streamer, то стример, иначе игрок)
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'player';
        const formFields = document.getElementById('formFields');

        if (role === 'streamer') {
            formFields.innerHTML = `
                <p style="color: #70a1ff; font-weight: bold; margin-форма: 15px 0;">Анкета для Стримеров</p>
                
                <label>Ник/Псевдоним:</label>
                <input type="text" id="username" required>

                <label>Платформа где стримите:</label>
                <input type="text" id="platform" placeholder="Twitch, YouTube, Trovo..." required>

                <label>Ник на платформе:</label>
                <input type="text" id="platform_nick" required>

                <label>Свои сильные и слабые стороны:</label>
                <textarea id="strengths" required></textarea>

                <label>Описание Вашего персонажа/Аватара:</label>
                <textarea id="avatar_desc" required></textarea>

                <label>Согласны ли вы, когда придет ваша очередь, ответить человеку, который с вами свяжется по поводу сотрудничества?</label>
                <select id="agreement" required>
                    <option value="">-- Выберите --</option>
                    <option value="Да">Да</option>
                    <option value="Нет">Нет</option>
                </select>

                <input type="hidden" id="contact" value="Стример (см. платформу)">
            `;
        } else {
            formFields.innerHTML = `
                <p style="color: #ff4757; font-weight: bold;">Анкета участника</p>
                
                <label>Твоё имя / Никнейм:</label>
                <input type="text" id="username" required>

                <label>Твой Telegram / Discord / Ссылка на связь:</label>
                <input type="text" id="contact" required>
            `;
        }

        const form = document.getElementById('appForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.style.color = "yellow";
            messageDiv.innerText = "Отправка...";

            const username = document.getElementById('username').value;
            let contactVal = document.getElementById('contact').value;
            
            // Если это стример, соберём подробности в один контакт для удобства базы данных
            if (role === 'streamer') {
                const plat = document.getElementById('platform').value;
                const pNick = document.getElementById('platform_nick').value;
                const strong = document.getElementById('strengths').value;
                const avatar = document.getElementById('avatar_desc').value;
                const agree = document.getElementById('agreement').value;
                
                contactVal = `Платформа: ${plat}, Ник: ${pNick} | Сильные/слабые: ${strong} | Персонаж: ${avatar} | Согласен ответить: ${agree}`;
            }

            const { data, error } = await client
                .from('applications')
                .insert([{ 
                    username: username, 
                    contact: contactVal, 
                    status: role === 'streamer' ? 'streamer_pending' : 'player_pending' 
                }]);

            if (error) {
                console.error(error);
                messageDiv.style.color = "#ff4757";
                messageDiv.innerText = "Ошибка: " + error.message;
            } else {
                messageDiv.style.color = "#2ed573";
                messageDiv.innerText = "Заявка успешно отправлена!";
                form.reset();
            }
        });
    </script>
</body>
</html>
