<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятая стадия — Подача заявок</title>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4757; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            font-size: 16px;
        }
        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #ff6b81; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Пятая стадия</h1>
        <p>Оставь заявку на участие или поддержку проекта!</p>

        <form id="appForm">
            <input type="text" id="username" placeholder="Твое имя / Никнейм" required><br>
            <input type="text" id="contact" placeholder="Твой Telegram или Discord" required><br>
            <button type="submit">Отправить заявку</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        // ВСТАВЬ СВОИ ДАННЫЕ СЮДА:
        const SUPABASE_URL = "https://lochgdhgcpqpmbcgmdvy.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_G0sF7IL1XrCqf4Wad0bjCQ_1hCOCWPw"; 

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('appForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.style.color = "yellow";
            messageDiv.innerText = "Отправка...";

            const username = document.getElementById('username').value;
            const contact = document.getElementById('contact').value;

            const { data, error } = await supabase
                .from('applications')
                .insert([{ username: username, contact: contact }]);

            if (error) {
                console.error(error);
                messageDiv.style.color = "#ff4757";
                messageDiv.innerText = "Ошибка при отправке: " + error.message;
            } else {
                messageDiv.style.color = "#2ed573";
                messageDiv.innerText = "Заявка успешно отправлена! Ожидайте модерации.";
                form.reset();
            }
        });
    </script>
</body>
</html>
