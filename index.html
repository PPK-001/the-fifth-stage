<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятая стадия — Презентация игры</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        /* Баннер */
        .banner {
            background: linear-gradient(180deg, #ff4757 0%, #121212 100%);
            padding: 80px 20px 40px;
        }
        h1 { font-size: 3em; margin-bottom: 10px; }
        p.subtitle { font-size: 1.2em; color: #eee; max-width: 600px; margin: 0 auto 30px; }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Кнопки действий */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-primary { background-color: #ff4757; }
        .btn-streamer { background-color: #70a1ff; }
        .btn-wish { background-color: #2ed573; width: 90%; font-size: 20px; }
        .btn-wish:disabled { opacity: 0.6; cursor: default; transform: none; }

        /* Счётчик */
        .counter-box {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 30px 0;
        }
        .counter-number {
            font-size: 2.5em;
            color: #2ed573;
            font-weight: bold;
        }

        /* Новости */
        .post-card { background: #1e1e1e; border: 2px solid #333; border-radius: 10px; padding: 20px; margin: 20px 0; text-align: left; }
        .post-card h3 { margin: 0 0 5px; color: #ff4757; }
        .post-card .date { font-size: 12px; color: #888; margin-bottom: 10px; }
        .post-card img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        .post-card p { white-space: pre-wrap; line-height: 1.5; color: #ddd; }
        .download-btn { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #2ed573; color: #fff; font-weight: bold; border-radius: 6px; text-decoration: none; }
        .download-btn:hover { background: #26b862; }

        /* Участники */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin: 20px 0 40px; }
        .member { background: #1e1e1e; border: 2px solid #333; border-radius: 10px; overflow: hidden; }
        .member img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
        .member .name { font-weight: bold; color: #70a1ff; margin: 10px 10px 2px; }
        .member .caption { font-size: 13px; color: #bbb; margin: 0 10px 12px; }
    </style>
</head>
<body>

    <!-- Шапка / Баннер -->
    <div class="banner">
        <h1>ПЯТАЯ СТАДИЯ</h1>
        <p class="subtitle">Официальная презентация проекта. Узнай подробности игры и присоединяйся к сообществу!</p>
    </div>

    <div class="container">

        <!-- Счётчик желающих -->
        <div class="counter-box">
            <p>Уже ждут выход игры:</p>
            <div class="counter-number" id="wishCount">...</div>
            <br>
            <button class="btn btn-wish" id="wishBtn">❤️ Я желаю видеть эту игру и буду рад в неё поиграть!</button>
        </div>

        <!-- Новости и обновления -->
        <h2>Новости и обновления</h2>
        <div id="posts"></div>

        <!-- Участники проекта -->
        <h2>Участники проекта</h2>
        <div class="gallery" id="members"></div>

        <!-- Кнопки перехода на вторую страницу -->
        <h2>Принять участие в проекте</h2>
        <a href="apply.html?role=player" class="btn btn-primary">Подать заявку на участие</a>
        <a href="apply.html?role=streamer" class="btn btn-streamer">Присоединиться как стример</a>

    </div>

    <script>
        const SUPABASE_URL = "https://lochgdhgcpqpmbcgmdvy.supabase.co";
        const SUPABASE_KEY = "sb_publishable_G0sF7IL1XrCqf4Wad0bjCQ_1hCOCWPw";
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const countElement = document.getElementById('wishCount');
        const wishBtn = document.getElementById('wishBtn');

        // Загружаем общее число из базы
        async function loadCount() {
            const { data, error } = await client
                .from('wishes')
                .select('count')
                .eq('id', 1)
                .single();
            if (error) {
                console.error(error);
                countElement.innerText = "?";
            } else {
                countElement.innerText = data.count;
            }
        }
        loadCount();

        // Если уже голосовал в этом браузере, блокируем кнопку
        if (localStorage.getItem('voted')) {
            wishBtn.disabled = true;
        }

        wishBtn.addEventListener('click', async () => {
            if (localStorage.getItem('voted')) {
                alert('Вы уже отдали свой голос за игру!');
                return;
            }
            wishBtn.disabled = true;
            const { data, error } = await client.rpc('add_wish');
            if (error) {
                console.error(error);
                alert('Не получилось отправить голос, попробуйте позже.');
                wishBtn.disabled = false;
            } else {
                localStorage.setItem('voted', 'true');
                countElement.innerText = data;
                alert('Спасибо за поддержку проекта!');
            }
        });

        // Загрузка новостей
        async function loadPosts() {
            const box = document.getElementById('posts');
            const { data, error } = await client
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) { console.error(error); return; }
            if (!data.length) { box.innerText = "Скоро здесь появятся новости."; return; }
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = 'post-card';

                const h = document.createElement('h3');
                h.textContent = p.title;
                const d = document.createElement('div');
                d.className = 'date';
                d.textContent = new Date(p.created_at).toLocaleDateString('ru-RU');
                card.append(h, d);

                if (p.body) {
                    const t = document.createElement('p');
                    t.textContent = p.body;
                    card.appendChild(t);
                }
                if (p.image_url) {
                    const img = document.createElement('img');
                    img.src = p.image_url;
                    card.appendChild(img);
                }
                if (p.file_url) {
                    const a = document.createElement('a');
                    a.href = p.file_url;
                    a.className = 'download-btn';
                    a.textContent = '⬇ Скачать: ' + (p.file_name || 'файл');
                    card.appendChild(a);
                }
                box.appendChild(card);
            });
        }
        loadPosts();

        // Загрузка участников
        async function loadMembers() {
            const box = document.getElementById('members');
            const { data, error } = await client
                .from('participants')
                .select('*')
                .order('created_at', { ascending: true });
            if (error) { console.error(error); return; }
            if (!data.length) {
                box.style.display = 'block';
                box.innerText = "Скоро здесь появятся участники.";
                return;
            }
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = 'member';

                const img = document.createElement('img');
                img.src = p.image_url;
                img.alt = p.name;

                const n = document.createElement('div');
                n.className = 'name';
                n.textContent = p.name;

                card.append(img, n);

                if (p.caption) {
                    const c = document.createElement('div');
                    c.className = 'caption';
                    c.textContent = p.caption;
                    card.appendChild(c);
                }
                box.appendChild(card);
            });
        }
        loadMembers();
    </script>
</body>
</html>

        <div
