<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятая стадия — Презентация игры</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        /* Баннер */
        .banner {
            background: linear-gradient(180deg, #ff4757 0%, #121212 100%);
            padding: 80px 20px 40px;
        }
        h1 { font-size: 3em; margin-bottom: 10px; }
        p.subtitle { font-size: 1.2em; color: #eee; max-width: 600px; margin: 0 auto 30px; }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Кнопки действий */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-primary { background-color: #ff4757; }
        .btn-streamer { background-color: #70a1ff; }
        .btn-wish { background-color: #2ed573; width: 90%; font-size: 20px; }

        /* Счётчик */
        .counter-box {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 30px 0;
        }
        .counter-number {
            font-size: 2.5em;
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Шапка / Баннер -->
    <div class="banner">
        <h1>ПЯТАЯ СТАДИЯ</h1>
        <p class="subtitle">Официальная презентация проекта. Узнай подробности игры и присоединяйся к сообществу!</p>
    </div>

    <div class="container">

        <!-- Счётчик желающих -->
        <div class="counter-box">
            <p>Уже ждут выход игры:</p>
            <div class="counter-number" id="wishCount">1</div>
            <br>
            <button class="btn btn-wish" id="wishBtn">❤️ Я желаю видеть эту игру и буду рад в неё поиграть!</button>
        </div>

        <!-- Кнопки перехода на вторую страницу -->
        <h2>Принять участие в проекте</h2>
        <a href="apply.html" class="btn btn-primary">Подать заявку на участие</a>
        <a href="apply.html" class="btn btn-streamer">Присоединиться как стример</a>

    </div>

    <script>
        // Простая локальная логика счётчика +1
        let count = localStorage.getItem('game_wishes') || 1;
        const countElement = document.getElementById('wishCount');
        const wishBtn = document.getElementById('wishBtn');

        countElement.innerText = count;

        wishBtn.addEventListener('click', () => {
            if (!localStorage.getItem('voted')) {
                count++;
                localStorage.setItem('game_wishes', count);
                localStorage.setItem('voted', 'true');
                countElement.innerText = count;
                alert('Спасибо за поддержку проекта!');
            } else {
                alert('Вы уже отдали свой голос за игру!');
            }
        });
    </script>
</body>
</html>
