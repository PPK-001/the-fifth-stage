<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Пятая стадия</title>
    <meta name="robots" content="noindex">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 10px; }
        h1 { color: #ff4757; text-align: center; }
        h2 { color: #70a1ff; margin-top: 40px; border-top: 1px solid #333; padding-top: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #bbb; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #333; background: #2b2b2b; color: #fff; font-size: 15px; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; padding: 14px; margin-top: 20px; background: #ff4757; color: #fff; border: none; border-radius: 5px; font-size: 17px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff6b81; }
        button:disabled { opacity: 0.5; cursor: wait; }
        .small-btn { width: auto; padding: 6px 12px; margin: 0; font-size: 13px; background: #444; }
        #msg { margin-top: 15px; font-weight: bold; text-align: center; }
        .post { background: #252525; padding: 12px; border-radius: 6px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .post img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
        .post .info { flex: 1; display: flex; align-items: center; gap: 10px; }
        .badge { font-size: 12px; color: #70a1ff; margin-left: 6px; }
        a { color: #888; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Админка</h1>
 
    <!-- Вход -->
    <form id="loginForm">
        <label>Email:</label>
        <input type="email" id="email" required>
        <label>Пароль:</label>
        <input type="password" id="password" required>
        <button type="submit">Войти</button>
    </form>
 
    <div id="adminBox" class="hidden">
 
        <!-- Новости -->
        <form id="postForm">
            <label>Заголовок:</label>
            <input type="text" id="title" required>
            <label>Текст:</label>
            <textarea id="body"></textarea>
            <label>Картинка (необязательно):</label>
            <input type="file" id="image" accept="image/*">
            <label>Файл для скачивания (необязательно, до 50 МБ):</label>
            <input type="file" id="file">
            <button type="submit" id="postBtn">Опубликовать новость</button>
        </form>
 
        <h3>Опубликованные новости</h3>
        <div id="postList"></div>
 
        <!-- Участники -->
        <h2>Участники проекта</h2>
        <form id="partForm">
            <label>Имя / ник участника:</label>
            <input type="text" id="partName" required>
 
            <label>Кем он будет в игре:</label>
            <select id="partRole" required>
                <option value="player">Игрок</option>
                <option value="npc">НПС</option>
            </select>
 
            <!-- Только для Игрока -->
            <div id="playerFields">
                <label>Класс персонажа:</label>
                <select id="partClass">
                    <option value="Дуэлянт">Дуэлянт</option>
                    <option value="Инициатор">Инициатор</option>
                    <option value="Защитник">Защитник</option>
                    <option value="Специалист">Специалист</option>
                    <option value="Катализатор">Катализатор</option>
                </select>
            </div>
 
            <!-- Только для НПС -->
            <div id="npcFields" class="hidden">
                <label>Лор персонажа:</label>
                <textarea id="partLore" placeholder="История, характер, роль в мире..."></textarea>
            </div>
 
            <label>Подпись (необязательно):</label>
            <input type="text" id="partCaption" placeholder="Например: озвучка, тестирование, арт...">
            <label>Изображение:</label>
            <input type="file" id="partImage" accept="image/*" required>
            <button type="submit" id="partBtn">Добавить участника</button>
        </form>
 
        <h3>Добавленные участники</h3>
        <div id="partList"></div>
 
        <button class="small-btn" id="logoutBtn" style="margin-top:30px">Выйти</button>
    </div>
 
    <div id="msg"></div>
    <p style="text-align:center"><a href="index.html">← На главную</a></p>
</div>
 
<script>
    const SUPABASE_URL = "https://lochgdhgcpqpmbcgmdvy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_G0sF7IL1XrCqf4Wad0bjCQ_1hCOCWPw";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
    const MAX_FILE_MB = 50;
 
    const loginForm = document.getElementById('loginForm');
    const adminBox = document.getElementById('adminBox');
    const postForm = document.getElementById('postForm');
    const postList = document.getElementById('postList');
    const partForm = document.getElementById('partForm');
    const partList = document.getElementById('partList');
    const postBtn = document.getElementById('postBtn');
    const partBtn = document.getElementById('partBtn');
    const msg = document.getElementById('msg');
 
    const partRole = document.getElementById('partRole');
    const playerFields = document.getElementById('playerFields');
    const npcFields = document.getElementById('npcFields');
 
    function setMsg(text, color) { msg.style.color = color; msg.innerText = text; }
 
    function updateRoleFields() {
        const isPlayer = partRole.value === 'player';
        playerFields.classList.toggle('hidden', !isPlayer);
        npcFields.classList.toggle('hidden', isPlayer);
    }
    partRole.addEventListener('change', updateRoleFields);
    updateRoleFields();
 
    function pathFromUrl(url, bucket) {
        if (!url) return null;
        const parts = url.split('/' + bucket + '/');
        if (parts.length < 2) return null;
        return decodeURIComponent(parts[1].split('?')[0]);
    }
 
    async function removeFile(bucket, url) {
        const path = pathFromUrl(url, bucket);
        if (path) await client.storage.from(bucket).remove([path]);
    }
 
    function showAdmin(isIn) {
        loginForm.classList.toggle('hidden', isIn);
        adminBox.classList.toggle('hidden', !isIn);
        if (isIn) { loadPosts(); loadParticipants(); }
    }
 
    async function init() {
        const { data } = await client.auth.getSession();
        showAdmin(!!data.session);
    }
    init();
 
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error } = await client.auth.signInWithPassword({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        });
        if (error) { setMsg("Ошибка входа: " + error.message, "#ff4757"); }
        else { setMsg("", "#fff"); showAdmin(true); }
    });
 
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await client.auth.signOut();
        showAdmin(false);
    });
 
    // ---------- Новости ----------
    postForm.addEventListener('submit', async (e) => {
        e.preventDefault();
 
        const img = document.getElementById('image').files[0];
        const file = document.getElementById('file').files[0];
 
        if (file && file.size > MAX_FILE_MB * 1024 * 1024) {
            setMsg("Файл больше " + MAX_FILE_MB + " МБ, он не загрузится", "#ff4757");
            return;
        }
 
        postBtn.disabled = true;
        setMsg("Загрузка...", "yellow");
 
        let imageUrl = null;
        let fileUrl = null;
        let fileName = null;
 
        if (img) {
            const ext = img.name.split('.').pop().toLowerCase();
            const path = Date.now() + "." + ext;
            const { error: upErr } = await client.storage.from('post-images').upload(path, img);
            if (upErr) { setMsg("Ошибка загрузки картинки: " + upErr.message, "#ff4757"); postBtn.disabled = false; return; }
            imageUrl = client.storage.from('post-images').getPublicUrl(path).data.publicUrl;
        }
 
        if (file) {
            const ext = file.name.includes('.') ? '.' + file.name.split('.').pop().toLowerCase() : '';
            const path = Date.now() + ext;
            const { error: fErr } = await client.storage.from('post-files').upload(path, file);
            if (fErr) { setMsg("Ошибка загрузки файла: " + fErr.message, "#ff4757"); postBtn.disabled = false; return; }
            fileName = file.name;
            fileUrl = client.storage.from('post-files').getPublicUrl(path, { download: file.name }).data.publicUrl;
        }
 
        const { error } = await client.from('posts').insert([{
            title: document.getElementById('title').value.trim(),
            body: document.getElementById('body').value.trim(),
            image_url: imageUrl,
            file_url: fileUrl,
            file_name: fileName
        }]);
 
        postBtn.disabled = false;
        if (error) { setMsg("Ошибка: " + error.message, "#ff4757"); return; }
        setMsg("Опубликовано!", "#2ed573");
        postForm.reset();
        loadPosts();
    });
 
    async function loadPosts() {
        const { data, error } = await client.from('posts').select('id,title,image_url,file_url').order('created_at', { ascending: false });
        postList.innerHTML = "";
        if (error) { setMsg("Ошибка: " + error.message, "#ff4757"); return; }
        data.forEach(p => {
            const row = document.createElement('div');
            row.className = 'post';
            const span = document.createElement('span');
            span.textContent = p.title;
            const del = document.createElement('button');
            del.className = 'small-btn';
            del.textContent = 'Удалить';
            del.onclick = async () => {
                if (!confirm('Удалить «' + p.title + '»?')) return;
                del.disabled = true;
                const { error: dErr } = await client.from('posts').delete().eq('id', p.id);
                if (dErr) { setMsg("Не удалось удалить: " + dErr.message, "#ff4757"); del.disabled = false; return; }
                await removeFile('post-images', p.image_url);
                await removeFile('post-files', p.file_url);
                setMsg("Удалено", "#2ed573");
                loadPosts();
            };
            row.append(span, del);
            postList.appendChild(row);
        });
    }
 
    // ---------- Участники ----------
    partForm.addEventListener('submit', async (e) => {
        e.preventDefault();
 
        const img = document.getElementById('partImage').files[0];
        if (!img) { setMsg("Выбери изображение", "#ff4757"); return; }
 
        partBtn.disabled = true;
        setMsg("Загрузка...", "yellow");
 
        const ext = img.name.split('.').pop().toLowerCase();
        const path = "participant-" + Date.now() + "." + ext;
        const { error: upErr } = await client.storage.from('post-images').upload(path, img);
        if (upErr) { setMsg("Ошибка загрузки картинки: " + upErr.message, "#ff4757"); postBtn.disabled = false; return; }
        const imageUrl = client.storage.from('post-images').getPublicUrl(path).data.publicUrl;
 
        const role = partRole.value;
        const row = {
            name: document.getElementById('partName').value.trim(),
            caption: document.getElementById('partCaption').value.trim(),
            image_url: imageUrl,
            role: role,
            class_number: role === 'player' ? document.getElementById('partClass').value : null,
            lore: role === 'npc' ? document.getElementById('partLore').value.trim() : null
        };
 
        const { error } = await client.from('participants').insert([row]);
 
        partBtn.disabled = false;
        if (error) { setMsg("Ошибка: " + error.message, "#ff4757"); return; }
        setMsg("Участник добавлен!", "#2ed573");
        partForm.reset();
        updateRoleFields();
        loadParticipants();
    });
 
    async function loadParticipants() {
        const { data, error } = await client.from('participants').select('*').order('created_at', { ascending: false });
        partList.innerHTML = "";
        if (error) { setMsg("Ошибка: " + error.message, "#ff4757"); return; }
        data.forEach(p => {
            const row = document.createElement('div');
            row.className = 'post';
 
            const info = document.createElement('div');
            info.className = 'info';
            const img = document.createElement('img');
            img.src = p.image_url;
            const span = document.createElement('span');
            span.textContent = p.name;
            const badge = document.createElement('span');
            badge.className = 'badge';
            // Если в базе колонка тоже class_number, читаем её безопасно:
            const cls = p.class_number || p.class || '';
            badge.textContent = p.role === 'npc' ? 'НПС' : ('Игрок' + (cls ? ' · ' + cls : ''));
            span.appendChild(badge);
            info.append(img, span);
 
            const del = document.createElement('button');
            del.classNameN = 'small-btn';
            del.textContent = 'Удалить';
            del.onclick = async () => {
                if (!confirm('Удалить «' + p.name + '»?')) return;
                del.disabled = true;
                const { error: dErr } = await client.from('participants').delete().eq('id', p.id);
                if (dErr) { setMsg("Не удалось удалить: " + dErr.message, "#ff4757"); del.disabled = false; return; }
                await removeFile('post-images', p.image_url);
                setMsg("Удалено", "#2ed573");
                loadParticipants();
            };
            row.append(info, del);
            partList.appendChild(row);
        });
    }
</script>
</body>
</html>
